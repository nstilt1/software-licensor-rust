[target.aarch64-unknown-linux-gnu]
image = "ghcr.io/cross-rs/aarch64-unknown-linux-gnu:edge"
pre-build = [
    "apt-get update && apt-get install --assume-yes curl unzip",
    "curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-aarch_64.zip",
    "unzip -o protoc-25.1-linux-aarch_64.zip -d /usr/local",
    "chmod 755 /usr/local/bin/protoc"
]

[target.aarch64-unknown-linux-musl]
pre-build = [
    "apt-get update && apt-get install --assume-yes curl unzip",
    "curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-aarch_64.zip",
    "unzip -o protoc-25.1-linux-aarch_64.zip -d /usr/local",
    "chmod 755 /usr/local/bin/protoc"
]