syntax = "proto3";

package fetch_product_info;

message FetchProductInfoRequest {
    
}

message FetchProductInfoResponse {
    map<string, ProductInfo> product_info = 1;
}

message ProductInfo {
    bool is_offline_allowed = 1;
    string version = 2;
    uint32 max_machines_per_license = 3;
    string product_name = 4;
    string public_key = 5;
}